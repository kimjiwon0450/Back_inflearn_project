name: CI/CD Pipeline

on:
  push:
    branches:
      - feature/courseservice  # 혹은 master

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: 116981783440.dkr.ecr.ap-northeast-2.amazonaws.com
  EC2_HOST: ubuntu@43.203.255.111
  SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker images
        run: |
          SERVICES="config-service discovery-service gateway-service user-service order-service course-service post-service eval-service"
          for SERVICE in $SERVICES; do
            docker build -t $ECR_REPOSITORY/$SERVICE:latest ./$SERVICE
            docker push $ECR_REPOSITORY/$SERVICE:latest
          done

      

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ubuntu
          key: ${{ env.SSH_KEY }}
          script: |
            cd ~/myInflearn/Back_inflearn_project
            docker-compose pull
            docker-compose down
            docker-compose up -d --build

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} << 'EOF'
            cd ~/myInflearn
            ./deploy.sh
          EOF
